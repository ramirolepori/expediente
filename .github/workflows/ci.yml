name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Vercel avisa cuando termina un despliegue: ahí corre la prueba rápida contra esa URL
  deployment_status:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  controles:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run validar

  e2e:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Las pruebas más largas se reparten entre las dos partes.
      PRUEBAS_SEGUNDA_PARTE: 'modo traidor: uno solo ve la ficha|minijuegos: descifrar un mensaje|pizarra: corcho con hilos|laboratorio: el papel roto'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            filtro: --grep-invert
          - shard: 2
            filtro: --grep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # El runner ya trae las bibliotecas de Chromium; la suite usa el modo headless.
      - run: npx playwright install --only-shell chromium
      - run: npm run e2e -- --fully-parallel --workers=1 ${{ matrix.filtro }} "$PRUEBAS_SEGUNDA_PARTE"
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-playwright-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  verificar:
    if: always() && github.event_name != 'deployment_status'
    needs: [controles, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar los resultados
        run: test '${{ needs.controles.result }}' = success && test '${{ needs.e2e.result }}' = success

  humo-produccion:
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run humo -- ${{ github.event.deployment_status.target_url }}
